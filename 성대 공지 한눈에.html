.org{color:var(--accent);font-size:13px;font-weight:500}

.dl{display:inline-flex;flex-direction:column;align-items:center;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}

.dl.off{background:none;color:var(--muted);font-weight:400}
.c-date{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

    {id:141503,cat:'채용/모집',title:'(2027년 1학기) CAMPUS Asia 일본파견 교환장학생 모집 연장',dept:'유일현',date:'2026-11-02',views:802,file:1,tags:['exchange','scholarship']},
    {id:141152,cat:'채용/모집',title:'통증 예측과 뇌 반응 연구 참여자 모집',dept:'김동호',date:'2026-11-02',views:2756,tags:['parttime']},
    {id:140601,cat:'장학',title:'2026학년도 심산혁신장학금 장학생 선발안내( ~ 2026년 11월 6일(금) 오후 5시까지)',dept:'성현호',date:'2026-11-02',views:26076,file:1,tags:['scholarship'],dl:'2026-11-06',dlText:'11/6(금) 17:00'},
    {id:140495,cat:'학사',title:'2026학년도 겨울 계절수업 본교생 → 타 대학 학점교류 수강 안내(진행 중)',dept:'교무팀',date:'2026-11-02',views:30203,file:1,tags:['academic']},
    {id:140949,cat:'학사',title:'[성균융합원] 2027학년도 1학기 융합연구학점제 시행 안내(신청 ~11/25)',dept:'성균융합원',date:'2026-11-02',views:15168,file:1,tags:['academic'],dl:'2026-11-25',dlText:'11/25 신청 마감'},
    {id:141425,cat:'일반',title:'2026 기숙사 생활 콘텐츠 공모전 실시 안내',dept:'명륜학사',date:'2026-11-02',views:3109,file:1,tags:['startup','life'],campus:'인문'},
    {id:140807,cat:'취업',title:'[학생인재개발팀/대학일자리플러스센터] 2026 하반기 실전 모의면접[인사캠 추가 모집]',dept:'박은선',date:'2026-11-02',views:4651,file:1,tags:['career'],campus:'인문'},
    {id:141486,cat:'행사/세미나',title:'[인권센터] 2026 성균관대학교 제5회 인권세미나 개최 안내',dept:'차남희',date:'2026-11-02',views:924,file:1,tags:['seminar']},
    {id:140964,cat:'채용/모집',title:'[DS교육센터] 2026-2학기 DS교과지원 TA 모집',dept:'안지운',date:'2026-11-02',views:8424,file:1,tags:['parttime']}
  ];

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function store(k,v){try{if(v===undefined){return localStorage.getItem(k)}if(v===null){localStorage.removeItem(k)}else{localStorage.setItem(k,v)}}catch(e){}return null}
  function dateOnly(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  var now=new Date(), todayMid=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  function daysTo(s){return Math.round((dateOnly(s)-todayMid)/864e5)}
  function md(s){var p=s.split('-');return p[1]+'.'+p[2]}

  /* 제목 앞 [기관] 분리 */
  N.forEach(function(n){
    var m=n.title.match(/^\[([^\]]+)\]\s*(.*)$/);
    n.org=m?m[1]:''; n.text=m?m[2]:n.title;
    n.url=BASE+'notice01.do?mode=view&articleNo='+n.id+'&article.offset=0&articleLimit=10';
  });

  var read={}; try{read=JSON.parse(store('skku_read')||'{}')}catch(e){}
  var profile=null; try{profile=JSON.parse(store('skku_profile')||'null')}catch(e){}
  var tab='all';

  /* ---------- mode ---------- */
  var app=$('app'), tabsEl=$('tabs'), top=$('top'), layout=$('layout');
  var userMode=store('skku_mode');
  function autoMode(){return window.innerWidth<760?'phone':'pc'}
  function setMode(m,save){
    app.dataset.mode=m;
    $('modePc').setAttribute('aria-pressed',String(m==='pc'));
    $('modePhone').setAttribute('aria-pressed',String(m==='phone'));
    if(save){userMode=m;store('skku_mode',m)}
    if(m==='phone'){top.appendChild(tabsEl)}else{layout.insertBefore(tabsEl,layout.firstChild)}
  }
  $('modePc').onclick=function(){setMode('pc',true)};
  $('modePhone').onclick=function(){setMode('phone',true)};
  window.addEventListener('resize',function(){if(!userMode){setMode(autoMode(),false)}});

  /* ---------- matching ---------- */
  function hasProfile(p){return !!p&&(p.interests&&p.interests.length||p.campus||p.college||p.major||p.kw||p.gpa||p.income)}
  function match(n,p){
    var s=0,r=[];
    if(!hasProfile(p))return{s:0,r:r};
    var ints=p.interests||[];
    n.tags.forEach(function(t){if(ints.indexOf(t)>-1){s+=3;r.push('관심: '+LABEL[t])}});
    if(n.campus&&p.campus&&n.campus===p.campus){s+=2;r.push(p.campus==='인문'?'내 캠퍼스(서울)':'내 캠퍼스(수원)')}
    if(n.college&&p.college===n.college){s+=3;r.push('내 단과대')}
    if(n.audience==='재학'&&p.status==='재학'){s+=1;r.push('재학생 대상')}
    var title=n.title.toLowerCase();
    if(p.major&&p.major.length>1&&title.indexOf(p.major.toLowerCase())>-1){s+=3;r.push('내 전공')}
    (p.kw||'').split(',').forEach(function(k){k=k.trim().toLowerCase();if(k&&title.indexOf(k)>-1){s+=2;r.push('키워드: '+k)}});
    if(n.tags.indexOf('scholarship')>-1&&(p.gpa||p.income)){s+=1;r.push('학점·소득분위 확인')}
    if(s>0&&n.dl){var d=daysTo(n.dl);if(d>=0&&d<=7){s+=1}}
    return{s:s,r:r};
  }
  function enrich(){N.forEach(function(n){var m=match(n,profile);n.score=m.s;n.reasons=m.r})}

  /* ---------- render ---------- */
  function isNew(n){return (todayMid-dateOnly(n.date))/864e5<=1}
  function dlBadge(n){
    if(!n.dl)return '<span class="dl off">상시</span>';
    var d=daysTo(n.dl);
    if(d<0)return '<span class="dl off">마감</span>';
    var t=d===0?'오늘 마감':'D-'+d;
    return '<span class="dl'+(d<=3?' hot':'')+'">'+t+'<small>'+esc(n.dlText||'')+'</small></span>';
  }
  function row(n){
    var cls='n'+(read[n.id]?' read':'');
    var meta='<span class="m-date">'+md(n.date)+'</span><span>'+esc(n.dept)+'</span><span>조회 '+n.views.toLocaleString('ko-KR')+'</span>'+(n.file?'<span>첨부</span>':'')+(n.note&&!n.dl?'<span>'+esc(n.note)+'</span>':'');
    var why=n.reasons.length?'<div class="why">'+n.reasons.map(function(x){return'<span>'+esc(x)+'</span>'}).join('')+'</div>':'';
    var hint='';
    if(n.tags.indexOf('scholarship')>-1&&profile&&(profile.gpa||profile.income)){
      hint='<div class="hint">내 조건: '+(profile.gpa?'학점 '+esc(profile.gpa):'')+(profile.gpa&&profile.income?' · ':'')+(profile.income?'소득 '+esc(profile.income)+(/^\d+$/.test(profile.income)?'분위':''):'')+'. 지원 자격은 원문에서 확인하세요.</div>';
    }
    return '<article class="'+cls+'"><div class="c-cat"><span class="chip">'+esc(n.cat)+'</span></div>'+
      '<div class="c-main"><a class="ttl" href="'+n.url+'" target="_blank" rel="noopener" data-id="'+n.id+'">'+
      (n.org?'<span class="org">'+esc(n.org)+'</span> ':'')+esc(n.text)+(isNew(n)?'<span class="new">NEW</span>':'')+'</a>'+
      '<div class="meta">'+meta+'</div>'+why+hint+'</div>'+
      '<div class="c-dl">'+dlBadge(n)+'</div><div class="c-date">'+md(n.date)+'</div></article>';
  }
  function pool(){
    if(tab==='me')return N.filter(function(n){return n.score>=2});
    if(tab==='all')return N.slice();
    return N.filter(function(n){return n.cat===tab});
  }
  function renderTabs(){
    var items=[['all','전체',N.length],['me','나에게 맞는 공지',N.filter(function(n){return n.score>=2}).length]];
    var h='';
    h+=tabBtn('all','전체',N.length,'');
    h+=tabBtn('me','나에게 맞는 공지',items[1][2],'me');
    h+='<div class="tabsep"></div>';
    CATS.forEach(function(c){h+=tabBtn(c,c,N.filter(function(n){return n.cat===c}).length,'')});
    tabsEl.innerHTML=h;
  }
  function tabBtn(key,label,cnt,extra){
    return '<button type="button" role="tab" class="tab '+extra+'" data-tab="'+esc(key)+'" aria-selected="'+(tab===key)+'">'+esc(label)+' <span class="cnt">'+cnt+'</span></button>';
  }
  function render(){
    enrich(); renderTabs();
    var q=$('q').value.trim().toLowerCase(), sort=$('sort').value;
    var base=pool();
    /* 마감 임박 */
    var urg=base.filter(function(n){return n.dl&&daysTo(n.dl)>=0}).sort(function(a,b){return daysTo(a.dl)-daysTo(b.dl)}).slice(0,6);
    var u=$('urgent');
    if(urg.length){
      u.hidden=false;
      u.innerHTML='<h2>마감 임박</h2><div class="urg-row">'+urg.map(function(n){var d=daysTo(n.dl);
        return '<a class="urg" href="'+n.url+'" target="_blank" rel="noopener" data-id="'+n.id+'"><span>'+dlBadge(n)+'</span><b>'+esc(n.text)+'</b><small>'+esc(n.cat)+'</small></a>'}).join('')+'</div>';
    }else{u.hidden=true}
    var list=base.filter(function(n){return !q||(n.title+n.dept).toLowerCase().indexOf(q)>-1});
    list.sort(function(a,b){
      if(sort==='deadline'){var ad=a.dl&&daysTo(a.dl)>=0?daysTo(a.dl):9999,bd=b.dl&&daysTo(b.dl)>=0?daysTo(b.dl):9999;return ad-bd||b.id-a.id}
      if(sort==='views')return b.views-a.views;
      if(tab==='me'&&b.score!==a.score)return b.score-a.score;
      return b.date<a.date?-1:b.date>a.date?1:b.id-a.id;
    });
    $('listTitle').textContent=tab==='all'?'전체 공지':tab==='me'?'나에게 맞는 공지':tab;
    $('stamp').textContent='원문 기준 '+STAMP+' 확인 · '+list.length+'건';
    var out='';
    if(tab==='me'&&!hasProfile(profile)){
      out='<div class="empty"><p>내 정보를 입력하면 장학, 알바·인턴, 강연처럼 나에게 맞는 공지만 모아 보여줍니다.</p><button class="btn primary" type="button" data-act="profile">내 정보 입력하기</button></div>';
    }else if(!list.length){
      out='<div class="empty"><p>'+(q?'검색 결과가 없습니다.':tab==='me'?'지금 맞는 공지가 없습니다. 관심 분야를 더 추가해 보세요.':'확인된 공지가 없습니다. 원문 게시판에서 직접 확인하세요.')+'</p></div>';
    }else{out=list.map(row).join('')}
    $('list').innerHTML=out;
    var more=$('more');
    more.href=BASE+(BOARD[tab]||'notice01')+'.do';
    more.textContent=(BOARD[tab]?tab+' ':'')+'원문 게시판에서 더 보기';
  }

  /* ---------- events ---------- */
  tabsEl.addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;tab=b.dataset.tab;render()});
  $('q').addEventListener('input',render);
  $('sort').addEventListener('change',render);
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[data-id]');
    if(a){read[a.dataset.id]=1;store('skku_read',JSON.stringify(read));var art=a.closest('.n');if(art)art.classList.add('read')}
    if(e.target.closest('[data-act="profile"]'))openDrawer();
  });

  /* ---------- drawer / profile ---------- */
  var drawer=$('drawer'), scrim=$('scrim');
  COLLEGES.forEach(function(c){var o=document.createElement('option');o.textContent=c;$('f-college').appendChild(o)});
  Object.keys(LABEL).forEach(function(k){
    var l=document.createElement('label');
    l.innerHTML='<input type="checkbox" value="'+k+'"> '+esc(LABEL[k]);
    $('interests').appendChild(l);
  });
  function fillForm(){
    var p=profile||{};
    $('f-status').value=p.status||'';$('f-grade').value=p.grade||'';$('f-campus').value=p.campus||'';
    $('f-college').value=p.college||'';$('f-major').value=p.major||'';$('f-gpa').value=p.gpa||'';
    $('f-income').value=p.income||'';$('f-kw').value=p.kw||'';
    Array.prototype.forEach.call($('interests').querySelectorAll('input'),function(i){i.checked=(p.interests||[]).indexOf(i.value)>-1});
  }
  function readForm(){
    return{status:$('f-status').value,grade:$('f-grade').value,campus:$('f-campus').value,college:$('f-college').value,
      major:$('f-major').value.trim(),gpa:$('f-gpa').value,income:$('f-income').value,kw:$('f-kw').value.trim(),
      interests:Array.prototype.filter.call($('interests').querySelectorAll('input'),function(i){return i.checked}).map(function(i){return i.value})};
  }
  function openDrawer(){fillForm();buildBrief();drawer.hidden=false;scrim.hidden=false}
  function closeDrawer(){drawer.hidden=true;scrim.hidden=true}
  $('openProfile').onclick=openDrawer;$('closeProfile').onclick=closeDrawer;scrim.onclick=closeDrawer;
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!drawer.hidden)closeDrawer()});
  $('pform').addEventListener('submit',function(e){
    e.preventDefault();profile=readForm();store('skku_profile',JSON.stringify(profile));
    tab=hasProfile(profile)?'me':tab;render();buildBrief();toast('저장했습니다');closeDrawer();
  });
  $('reset').onclick=function(){profile=null;store('skku_profile',null);fillForm();render();buildBrief();toast('초기화했습니다')};

  /* ---------- brief ---------- */
  function buildBrief(){
    enrich();
    var lines=['[성대 공지 브리핑] '+todayMid.getFullYear()+'.'+(todayMid.getMonth()+1)+'.'+todayMid.getDate()];
    var urg=N.filter(function(n){return n.dl&&daysTo(n.dl)>=0}).sort(function(a,b){return daysTo(a.dl)-daysTo(b.dl)}).slice(0,3);
    if(urg.length){lines.push('','마감 임박');urg.forEach(function(n){var d=daysTo(n.dl);lines.push('· '+(d===0?'오늘':'D-'+d)+' '+n.text)})}
    var me=N.filter(function(n){return n.score>=2}).sort(function(a,b){return b.score-a.score}).slice(0,3);
    if(me.length){lines.push('','나에게 맞는 공지');me.forEach(function(n){lines.push('· '+n.text)})}
    var nw=N.filter(isNew).length;
    lines.push('','오늘 새 공지 '+nw+'건 · '+BASE+'notice01.do');
    $('brief').value=lines.join('\n');
  }
  $('copyBrief').onclick=function(){
    var t=$('brief').value;
    function fb(){$('brief').select();toast('선택했습니다. 직접 복사하세요')}
    try{navigator.clipboard.writeText(t).then(function(){toast('복사했습니다')},fb)}catch(e){fb()}
  };
  var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},1800)}

  /* ---------- init ---------- */
  $('today').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · 학교 전체 공지';
  setMode(userMode==='pc'||userMode==='phone'?userMode:autoMode(),false);
  render();
})();
</script>
